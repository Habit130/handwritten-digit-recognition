[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "handwritten-digit-learning-lab"
version = "0.1.0"
description = "A local-first learning lab for understanding and training an MNIST CNN."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.140.0",
  "numpy==2.4.6",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
